<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио | Дарья Глазунова</title>
    <style>
        /* Цветовые переменные для светлой темы */
        :root {
            --primary: #5A3D99;
            --primary-hover: #4a327d;
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --danger: #dc3545;
        }

        /* Цветовые переменные для тёмной темы */
        [data-theme="dark"] {
            --primary: #9b7ede;
            --primary-hover: #ae96e6;
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #f8f9fa;
            --text-muted: #a0a0a0;
            --border: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            transition: background-color 0.3s, color 0.3s; 
            line-height: 1.6; 
        }

        .container { max-width: 800px; margin: 0 auto; padding: 24px; padding-bottom: 80px; }
        .hidden { display: none !important; }

        /* Навигация */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: var(--surface); 
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; 
        }
        .nav-btn { 
            background: none; border: none; font-size: 16px; font-weight: 500;
            color: var(--text-muted); cursor: pointer; transition: color 0.2s; 
            padding: 8px 16px;
        }
        .nav-btn:hover, .nav-btn.active { color: var(--primary); }

        /* Шапка профиля */
        .header-profile { 
            background: var(--surface); 
            border: 1px solid var(--border);
            padding: 32px 24px; text-align: center; border-radius: 12px; margin-bottom: 24px;
        }
        .avatar-circle {
            width: 80px; height: 80px; background: var(--primary); color: white;
            border-radius: 50%; margin: 0 auto 16px auto; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 28px; font-weight: bold;
        }
        .header-profile h1 { font-size: 24px; margin-bottom: 4px; }
        .header-profile p { color: var(--text-muted); font-size: 14px; }
        .role-badge { 
            display: inline-block; padding: 4px 12px; border-radius: 16px; 
            background: var(--bg); border: 1px solid var(--border);
            color: var(--text); font-size: 12px; font-weight: 600; margin-top: 16px; 
        }

        /* Счётчики */
        .stats-row { 
            display: flex; justify-content: space-around; margin: 24px 0; 
            padding: 16px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
        }
        .stat-item { text-align: center; }
        .stat-value { font-weight: 700; font-size: 18px; }
        .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Кнопки */
        button { 
            padding: 10px 16px; border: none; border-radius: 6px; 
            cursor: pointer; font-weight: 500; font-size: 14px; 
            transition: background-color 0.2s; 
        }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); width: 100%; }
        .btn-secondary:hover { background: var(--border); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); width: 100%; }
        .btn-outline:hover { background: var(--surface); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 13px; width: auto; }

        /* Карточки и инпуты */
        .card { 
            background: var(--surface); padding: 24px; border-radius: 12px; 
            border: 1px solid var(--border); margin-bottom: 16px; 
        }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
        input[type="text"], input[type="password"], textarea { 
            width: 100%; padding: 10px 12px; border: 1px solid var(--border); 
            border-radius: 6px; background: var(--bg); color: var(--text); 
            font-family: inherit; font-size: 15px; 
        }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }

        /* Лента проектов */
        .project-card { 
            background: var(--surface); border: 1px solid var(--border); 
            padding: 20px; border-radius: 12px; margin-bottom: 16px; 
            cursor: pointer; transition: border-color 0.2s;
        }
        .project-card:hover { border-color: var(--primary); }
        .project-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .project-title { font-weight: 600; font-size: 18px; color: var(--text); }
        .project-category { font-size: 12px; font-weight: 600; color: var(--primary); text-transform: uppercase; }
        .project-tech { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
        .project-desc { font-size: 14px; color: var(--text); margin-bottom: 16px; }
        
        /* Фильтры */
        .filter-row { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .filter-chip { 
            padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); 
            background: var(--surface); color: var(--text); cursor: pointer; font-size: 14px;
        }
        .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Заметки */
        .note-item { border-bottom: 1px solid var(--border); padding: 16px 0; }
        .note-item:last-child { border-bottom: none; }
        .note-title { font-weight: 600; margin-bottom: 4px; }
        .note-date { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

        /* Аудит */
        #audit-log { 
            background: var(--bg); padding: 16px; border-radius: 6px; 
            font-family: monospace; font-size: 12px; max-height: 400px; overflow-y: auto; 
            white-space: pre-wrap; border: 1px solid var(--border);
        }
        
        /* Экран входа */
        .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }

        /* Детали проекта */
        .detail-content { margin-top: 24px; }
    </style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="screen-login" class="auth-screen">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 style="margin-bottom: 24px; text-align: center;">Вход в систему</h2>
        <div class="input-group">
            <label>Логин</label>
            <input type="text" id="login-username" autocomplete="off">
        </div>
        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="login-password">
        </div>
        <p id="login-error" style="color: var(--danger); font-size: 14px; margin-bottom: 16px; text-align: center;" class="hidden"></p>
        <button id="btn-login" class="btn-primary">Войти</button>
    </div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН ПРИЛОЖЕНИЯ -->
<div id="screen-app" class="hidden">
    
    <div class="container">

        <!-- 1. ПРОФИЛЬ -->
        <div id="page-profile" class="page-content hidden">
            <div class="header-profile">
                <div class="avatar-circle" id="profile-avatar">ДГ</div>
                <h1 id="profile-name">Имя</h1>
                <p id="profile-status">Статус</p>
                <span class="role-badge" id="profile-role">Роль</span>
            </div>

            <div class="card">
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-followers">1240</div>
                        <div class="stat-label">Подписчики</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">312</div>
                        <div class="stat-label">Подписки</div>
                    </div>
                </div>

                <button id="btn-subscribe" class="btn-primary" style="margin-bottom: 12px;">Подписаться</button>
                <button id="btn-edit-profile" class="btn-secondary" style="margin-bottom: 12px;">Редактировать профиль</button>
                <button id="btn-logout" class="btn-outline">Выйти</button>
            </div>
        </div>

        <!-- 2. РЕДАКТИРОВАНИЕ ПРОФИЛЯ -->
        <div id="page-edit-profile" class="page-content hidden">
            <div class="card">
                <h2 style="margin-bottom: 24px;">Редактирование профиля</h2>
                <div class="input-group">
                    <label>Имя</label>
                    <input type="text" id="edit-name" placeholder="Введите имя">
                </div>
                <div class="input-group">
                    <label>Статус</label>
                    <input type="text" id="edit-status" placeholder="Ваша роль или город">
                </div>
                <button id="btn-save-profile" class="btn-primary" style="margin-bottom: 12px;">Сохранить</button>
                <button id="btn-cancel-edit" class="btn-outline">Отмена</button>
            </div>
        </div>

        <!-- 3. ЛЕНТА -->
        <div id="page-feed" class="page-content">
            <h2 style="margin-bottom: 24px;">Лента сообщества</h2>
            <div class="filter-row" id="category-filters">
                <button class="filter-chip active" data-cat="Все">Все</button>
                <button class="filter-chip" data-cat="Android">Android</button>
                <button class="filter-chip" data-cat="Web">Web</button>
                <button class="filter-chip" data-cat="Дизайн">Дизайн</button>
            </div>
            <div id="feed-list"></div>
            <button id="btn-load-more" class="btn-secondary" style="margin-top: 16px;">Загрузить ещё</button>
        </div>

        <!-- ДЕТАЛИ ПРОЕКТА (открывается поверх ленты) -->
        <div id="page-project-detail" class="page-content hidden">
            <button id="btn-back-to-feed" class="btn-outline" style="margin-bottom: 24px; width: auto;">← Назад в ленту</button>
            <div class="card">
                <div class="project-category" id="detail-cat">Категория</div>
                <h1 id="detail-title" style="margin: 8px 0;">Название</h1>
                <div class="project-tech" id="detail-tech">Технологии</div>
                <div class="detail-content">
                    <p id="detail-desc">Описание проекта...</p>
                </div>
            </div>
        </div>

        <!-- 4. ЗАМЕТКИ -->
        <div id="page-notes" class="page-content hidden">
            <h2 style="margin-bottom: 24px;">Черновики</h2>
            <div class="card">
                <div class="input-group">
                    <input type="text" id="note-title" placeholder="Название идеи">
                    <textarea id="note-body" rows="4" placeholder="Описание..." style="margin-top: 12px;"></textarea>
                </div>
                <button id="btn-save-note" class="btn-primary">Сохранить</button>
                <button id="btn-cancel-note-edit" class="btn-outline hidden" style="margin-top: 12px;">Отменить редактирование</button>
            </div>
            <div id="notes-list"></div>
        </div>

        <!-- 5. НАСТРОЙКИ -->
        <div id="page-settings" class="page-content hidden">
            <h2 style="margin-bottom: 24px;">Настройки</h2>
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 16px;">Тёмная тема</span>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle" style="width: 20px; height: 20px; cursor: pointer;">
                    </label>
                </div>
            </div>
            <div class="card" style="text-align: center; color: var(--text-muted);">
                <p>Портфолио v1.0</p>
            </div>
        </div>

        <!-- 6. АДМИН -->
        <div id="page-admin" class="page-content hidden">
            <h2 style="margin-bottom: 24px;">Журнал аудита</h2>
            <div class="card">
                <div id="audit-log">Загрузка...</div>
                <button id="btn-refresh-audit" class="btn-secondary btn-sm" style="margin-top: 16px;">Обновить</button>
            </div>
        </div>

    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ -->
    <div class="bottom-nav">
        <button class="nav-btn" data-target="page-feed">Лента</button>
        <button class="nav-btn" data-target="page-notes">Заметки</button>
        <button class="nav-btn" data-target="page-profile">Профиль</button>
        <button class="nav-btn" data-target="page-settings">Настройки</button>
        <button class="nav-btn hidden" data-target="page-admin" id="nav-admin">Аудит</button>
    </div>

</div>

<script>
    // --- ДАННЫЕ ---
    const users = {
        'user': { password: '1234', name: 'Дарья Глазунова', status: 'Android-разработчик • Чебоксары', role: 'Пользователь', followers: 1240 },
        'admin': { password: '1234', name: 'Александр Админов', status: 'Владелец платформы', role: 'Администратор', followers: 5400 }
    };

    // Генерация 30 проектов для ленты
    const projectsData = [];
    const categories = ["Android", "Web", "Дизайн"];
    const baseProjects = [
        { title: "Приложение Погоды", tech: "Kotlin, Compose, Room", desc: "Показывает текущую погоду и прогноз." },
        { title: "Список задач (ToDo)", tech: "Kotlin, SQLite, Flow", desc: "Локальный список задач с напоминаниями." },
        { title: "Мой сайт-портфолио", tech: "HTML, CSS, JS", desc: "Сайт, который вы сейчас смотрите." },
        { title: "Дизайн интерфейса", tech: "Figma", desc: "Макет для мобильного приложения." }
    ];

    for (let i = 0; i < 30; i++) {
        const base = baseProjects[i % 4];
        projectsData.push({
            id: i,
            title: base.title + (i > 3 ? ` v${Math.floor(i/4)+1}` : ""),
            tech: base.tech,
            cat: categories[i % 3],
            desc: base.desc
        });
    }

    let currentUser = null;
    let currentCategory = "Все";
    let displayedProjectsCount = 4; // Изначально показываем 4
    let notes = [];
    let auditLog = [];
    let isSubscribed = false;
    let editingNoteIndex = -1;

    // --- DOM ---
    const screenLogin = document.getElementById('screen-login');
    const screenApp = document.getElementById('screen-app');
    const feedList = document.getElementById('feed-list');
    const btnLoadMore = document.getElementById('btn-load-more');

    // --- ЛОГИКА ---

    function logAudit(action, result = "ALLOWED", details = "") {
        const time = new Date().toLocaleString();
        auditLog.push(`[${time}] ${action} | ${result} | ${details}`);
        if (auditLog.length > 50) auditLog.shift();
    }

    // Вход
    document.getElementById('btn-login').onclick = () => {
        const user = document.getElementById('login-username').value.trim();
        const pass = document.getElementById('login-password').value;
        
        if (users[user] && users[user].password === pass) {
            currentUser = user;
            document.getElementById('login-error').classList.add('hidden');
            screenLogin.classList.add('hidden');
            screenApp.classList.remove('hidden');
            logAudit("LOGIN", "ALLOWED", user);
            updateProfileUI();
            loadNotes();
            loadAudit();
            renderFeed();
            navigateTo('page-feed');
        } else {
            const err = document.getElementById('login-error');
            err.textContent = "Неверный логин или пароль";
            err.classList.remove('hidden');
            logAudit("LOGIN", "DENIED", user);
        }
    };

    // Навигация
    function navigateTo(pageId) {
        document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
        document.getElementById(pageId).classList.remove('hidden');
        
        document.querySelectorAll('.nav-btn').forEach(b => {
            if (b.dataset.target === pageId) b.classList.add('active');
            else b.classList.remove('active');
        });
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => navigateTo(btn.dataset.target);
    });

    // Обновление профиля
    function updateProfileUI() {
        const user = users[currentUser];
        document.getElementById('profile-name').textContent = user.name;
        document.getElementById('profile-status').textContent = user.status;
        document.getElementById('profile-role').textContent = user.role;
        document.getElementById('stat-followers').textContent = user.followers;

        const initials = user.name.split(' ').map(n => n[0]).join('').substring(0,2);
        document.getElementById('profile-avatar').textContent = initials;

        if (user.role !== 'Администратор') {
            document.getElementById('nav-admin').classList.add('hidden');
        } else {
            document.getElementById('nav-admin').classList.remove('hidden');
        }
    }

    document.getElementById('btn-subscribe').onclick = () => {
        const btn = document.getElementById('btn-subscribe');
        const followersEl = document.getElementById('stat-followers');
        let count = parseInt(followersEl.textContent);
        
        if (!isSubscribed) {
            isSubscribed = true;
            followersEl.textContent = count + 1;
            btn.textContent = "Вы подписаны";
            btn.classList.remove('btn-primary');
            btn.classList.add('btn-secondary');
            logAudit("SUBSCRIBE", "ALLOWED", "Подписка оформлена");
        }
    };

    document.getElementById('btn-edit-profile').onclick = () => {
        document.getElementById('edit-name').value = users[currentUser].name;
        document.getElementById('edit-status').value = users[currentUser].status;
        navigateTo('page-edit-profile');
    };

    document.getElementById('btn-save-profile').onclick = () => {
        users[currentUser].name = document.getElementById('edit-name').value;
        users[currentUser].status = document.getElementById('edit-status').value;
        updateProfileUI();
        logAudit("EDIT_PROFILE", "ALLOWED", "Данные обновлены");
        navigateTo('page-profile');
    };

    document.getElementById('btn-cancel-edit').onclick = () => navigateTo('page-profile');

    document.getElementById('btn-logout').onclick = () => {
        logAudit("LOGOUT", "ALLOWED", currentUser);
        currentUser = null;
        isSubscribed = false;
        screenApp.classList.add('hidden');
        screenLogin.classList.remove('hidden');
        document.getElementById('login-username').value = '';
        document.getElementById('login-password').value = '';
    };

    // Тема
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.onchange = () => {
        if (themeToggle.checked) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    };

    // Лента
    function renderFeed() {
        feedList.innerHTML = '';
        const filtered = projectsData.filter(p => currentCategory === "Все" || p.cat === currentCategory);
        const toDisplay = filtered.slice(0, displayedProjectsCount);

        toDisplay.forEach(p => {
            const div = document.createElement('div');
            div.className = 'project-card';
            div.onclick = () => openProjectDetail(p.id);
            div.innerHTML = `
                <div class="project-header">
                    <div class="project-title">${p.title}</div>
                    <div class="project-category">${p.cat}</div>
                </div>
                <div class="project-tech">${p.tech}</div>
                <div class="project-desc">${p.desc}</div>
            `;
            feedList.appendChild(div);
        });

        if (displayedProjectsCount >= filtered.length) {
            btnLoadMore.style.display = 'none';
        } else {
            btnLoadMore.style.display = 'block';
        }
    }

    btnLoadMore.onclick = () => {
        displayedProjectsCount += 4;
        renderFeed();
    };

    document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.onclick = () => {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentCategory = chip.dataset.cat;
            displayedProjectsCount = 4; // Сброс при смене фильтра
            renderFeed();
        };
    });

    function openProjectDetail(id) {
        const p = projectsData.find(proj => proj.id === id);
        if (!p) return;
        
        document.getElementById('detail-cat').textContent = p.cat;
        document.getElementById('detail-title').textContent = p.title;
        document.getElementById('detail-tech').textContent = p.tech;
        document.getElementById('detail-desc').textContent = p.desc;
        
        navigateTo('page-project-detail');
    }

    document.getElementById('btn-back-to-feed').onclick = () => navigateTo('page-feed');

    // --- ЗАМЕТКИ (ЛР 11) ---
    function loadNotes() {
        const stored = localStorage.getItem(`notes_${currentUser}`);
        notes = stored ? JSON.parse(stored) : [];
        renderNotes();
    }

    function renderNotes() {
        const notesList = document.getElementById('notes-list');
        notesList.innerHTML = '';
        if (notes.length === 0) {
            notesList.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Заметок пока нет.</p>';
            return;
        }
        notes.forEach((n, index) => {
            const div = document.createElement('div');
            div.className = 'note-item';
            div.innerHTML = `
                <div class="note-title">${n.title}</div>
                <div>${n.body}</div>
                <div class="note-date">${n.date}</div>
                <div style="margin-top: 12px;">
                    <button class="btn-secondary btn-sm" onclick="editNote(${index})">Редактировать</button>
                    <button class="btn-danger btn-sm" onclick="deleteNote(${index})">Удалить</button>
                </div>
            `;
            notesList.appendChild(div);
        });
    }

    document.getElementById('btn-save-note').onclick = () => {
        const title = document.getElementById('note-title').value.trim();
        const body = document.getElementById('note-body').value.trim();
        if (!title) return alert('Введите заголовок');
        
        const date = new Date().toLocaleString();

        if (editingNoteIndex === -1) {
            notes.push({ title, body, date });
            logAudit("CREATE_NOTE", "ALLOWED", title);
        } else {
            notes[editingNoteIndex] = { title, body, date };
            logAudit("UPDATE_NOTE", "ALLOWED", title);
            editingNoteIndex = -1;
            document.getElementById('btn-save-note').textContent = "Сохранить";
            document.getElementById('btn-cancel-note-edit').classList.add('hidden');
        }

        localStorage.setItem(`notes_${currentUser}`, JSON.stringify(notes));
        document.getElementById('note-title').value = '';
        document.getElementById('note-body').value = '';
        renderNotes();
    };

    window.editNote = (index) => {
        editingNoteIndex = index;
        const note = notes[index];
        document.getElementById('note-title').value = note.title;
        document.getElementById('note-body').value = note.body;
        document.getElementById('btn-save-note').textContent = "Обновить заметку";
        document.getElementById('btn-cancel-note-edit').classList.remove('hidden');
        document.querySelector('#page-notes').scrollIntoView({ behavior: 'smooth' });
    };

    document.getElementById('btn-cancel-note-edit').onclick = () => {
        editingNoteIndex = -1;
        document.getElementById('note-title').value = '';
        document.getElementById('note-body').value = '';
        document.getElementById('btn-save-note').textContent = "Сохранить";
        document.getElementById('btn-cancel-note-edit').classList.add('hidden');
    };

    window.deleteNote = (index) => {
        if (confirm('Удалить заметку?')) {
            logAudit("DELETE_NOTE", "ALLOWED", notes[index].title);
            notes.splice(index, 1);
            localStorage.setItem(`notes_${currentUser}`, JSON.stringify(notes));
            renderNotes();
            if (editingNoteIndex === index) {
                editingNoteIndex = -1;
                document.getElementById('note-title').value = '';
                document.getElementById('note-body').value = '';
                document.getElementById('btn-save-note').textContent = "Сохранить";
                document.getElementById('btn-cancel-note-edit').classList.add('hidden');
            }
        }
    };

    // Админ
    function loadAudit() {
        if (currentUser && users[currentUser].role !== 'Администратор') return;
        document.getElementById('audit-log').textContent = auditLog.join('\n') || 'Журнал пуст.';
    }
    document.getElementById('btn-refresh-audit').onclick = loadAudit;

    logAudit("SYSTEM_START", "ALLOWED", "Приложение запущено");
</script>
</body>
</html>
